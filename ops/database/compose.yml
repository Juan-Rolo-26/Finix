name: finix-database

# PostgreSQL only. Keep the existing API/PM2 and Nginx deployment.
services:
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FINIX_REDIS_PORT:-16379}:6379"
    entrypoint: [sh, /opt/finix/redis.sh]
    volumes:
      - ./redis.sh:/opt/finix/redis.sh:ro
    secrets:
      - redis_password
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
  db:
    image: postgres:18.6
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: finix_prod
      POSTGRES_USER: finix_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --data-checksums
      TZ: UTC
    ports:
      - "127.0.0.1:${FINIX_DB_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker as PGDATA.
      - data:/var/lib/postgresql
      - ./roles.sh:/opt/finix/roles.sh:ro
      - ./roles.sql:/opt/finix/roles.sql:ro
      - ./permissions.sql:/opt/finix/permissions.sql:ro
      - ./psql.sh:/opt/finix/psql.sh:ro
      - ./restore.sh:/opt/finix/restore.sh:ro
    secrets:
      - bootstrap_password
      - owner_password
      - app_password
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - timezone=UTC
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_connections=off
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U finix_bootstrap -d finix_prod"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  data:

secrets:
  bootstrap_password:
    file: ./.secrets/bootstrap.password
  owner_password:
    file: ./.secrets/owner.password
  app_password:
    file: ./.secrets/app.password
  redis_password:
    file: ./.secrets/redis.password
