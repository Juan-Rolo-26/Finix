# ─────────────────────────────────────────────────────────────────────────────
# FINIX — Production Nginx Config (finixarg.com)
# Replace /etc/nginx/sites-available/finixarg.com
# ─────────────────────────────────────────────────────────────────────────────

# ── Rate limiting zones ────────────────────────────────────────────────────────
# Auth endpoints: 5 req/min per IP (brute force protection)
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
# API general: 60 req/s per IP
limit_req_zone $binary_remote_addr zone=api:20m rate=60r/s;
# Static assets: no limit
limit_req_zone $binary_remote_addr zone=static:10m rate=200r/s;

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name finixarg.com www.finixarg.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finixarg.com www.finixarg.com;

    # ── SSL ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/finixarg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finixarg.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # HSTS (1 year, include subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options      "nosniff" always;
    add_header X-Frame-Options             "DENY" always;
    add_header X-XSS-Protection            "1; mode=block" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content-Security-Policy — adjust as needed, especially for TradingView widgets
    add_header Content-Security-Policy     "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://s3.tradingview.com https://s.tradingview.com; frame-src https://s.tradingview.com; img-src 'self' data: https:; connect-src 'self' https://apxfsuxftnovgkvdrwpx.supabase.co wss://apxfsuxftnovgkvdrwpx.supabase.co;" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml text/javascript image/svg+xml
        application/wasm;

    # ── Frontend (static build) ───────────────────────────────────────────────
    root /var/www/finix/dist;
    index index.html;

    # ── Auth endpoints — strict rate limit ────────────────────────────────────
    location ~ ^/api/(auth|users/me/password|users/forgot-password) {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass          http://127.0.0.1:3010;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  30s;
        proxy_send_timeout  30s;
    }

    # ── API & WebSockets ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=200 nodelay;

        proxy_pass          http://127.0.0.1:3010;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        client_max_body_size 15M;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    location /socket.io/ {
        proxy_pass          http://127.0.0.1:3010;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── Health check (no rate limit, no logs) ────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3010;
        access_log off;
    }

    # ── Static assets (JS/CSS bundles with content hash) ─────────────────────
    location ~* \.(js|css|woff2|woff|ttf|svg|ico|png|jpg|jpeg|webp|gif|wasm)$ {
        limit_req zone=static burst=500 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Block sensitive paths ─────────────────────────────────────────────────
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    # ── Block common attack patterns ─────────────────────────────────────────
    location ~* (wp-admin|wp-login|\.php|xmlrpc) {
        deny all;
        return 404;
    }
}

# ── Admin subdomain (separate, extra-secured) ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.finixarg.com;

    ssl_certificate     /etc/letsencrypt/live/finixarg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finixarg.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # IP allowlist for admin — adjust to your office/home IPs
    # allow 1.2.3.4;      # Your IP
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
