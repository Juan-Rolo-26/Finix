<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Del beneficio operativo al capital</title><desc id="desc">Ejemplo didáctico de Finix con supuestos hipotéticos. NOPAT: 120; Capital promedio: 800; ROIC: 15%. No representa cotizaciones actuales.</desc><rect width="960" height="440" rx="18" fill="#f2f7f3"/><rect x="44" y="36" width="6" height="20" rx="3" fill="#087747"/><g font-family="Arial,Helvetica,sans-serif"><text x="62" y="51" font-size="13" fill="#087747" font-weight="700" letter-spacing="1.4">FINIX · EL CONCEPTO EN UN EJEMPLO</text><text x="44" y="105" font-size="30" font-weight="600" fill="#153c2b">Del beneficio operativo al capital</text><rect x="44" y="194" width="280" height="154" rx="12" fill="#ffffff" stroke="#d6e5db"/><text x="64" y="228" font-size="15" font-weight="500" fill="#587366">NOPAT</text><text x="64" y="284" font-size="23" font-weight="700" fill="#087747">120</text><rect x="340" y="194" width="280" height="154" rx="12" fill="#ffffff" stroke="#d6e5db"/><text x="360" y="228" font-size="15" font-weight="500" fill="#587366">Capital promedio</text><text x="360" y="284" font-size="23" font-weight="700" fill="#087747">800</text><rect x="636" y="194" width="280" height="154" rx="12" fill="#ffffff" stroke="#d6e5db"/><text x="656" y="228" font-size="15" font-weight="500" fill="#587366">ROIC</text><text x="656" y="284" font-size="23" font-weight="700" fill="#087747">15%</text><text x="44" y="398" font-size="14" fill="#587366">Ilustración didáctica · Supuestos hipotéticos · No es una cotización de mercado</text></g></svg>