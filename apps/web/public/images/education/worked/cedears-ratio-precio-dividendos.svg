<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">El dividendo sigue el ratio y los cargos</title><desc id="desc">Ejemplo didáctico de Finix con supuestos hipotéticos. Dividendo por acción: 2 USD; Ratio: 10 certificados; Bruto por certificado: 0,20 USD. No representa cotizaciones actuales.</desc><rect width="960" height="440" rx="18" fill="#f2f7f3"/><rect x="44" y="36" width="6" height="20" rx="3" fill="#087747"/><g font-family="Arial,Helvetica,sans-serif"><text x="62" y="51" font-size="13" fill="#087747" font-weight="700" letter-spacing="1.4">FINIX · EL CONCEPTO EN UN EJEMPLO</text><text x="44" y="105" font-size="30" font-weight="600" fill="#153c2b">El dividendo sigue el ratio y los cargos</text><rect x="44" y="194" width="280" height="154" rx="12" fill="#ffffff" stroke="#d6e5db"/><text x="64" y="228" font-size="15" font-weight="500" fill="#587366">Dividendo por acción</text><text x="64" y="284" font-size="23" font-weight="700" fill="#087747">2 USD</text><rect x="340" y="194" width="280" height="154" rx="12" fill="#ffffff" stroke="#d6e5db"/><text x="360" y="228" font-size="15" font-weight="500" fill="#587366">Ratio</text><text x="360" y="284" font-size="23" font-weight="700" fill="#087747">10 certificados</text><rect x="636" y="194" width="280" height="154" rx="12" fill="#ffffff" stroke="#d6e5db"/><text x="656" y="228" font-size="15" font-weight="500" fill="#587366">Bruto por certificado</text><text x="656" y="284" font-size="23" font-weight="700" fill="#087747">0,20 USD</text><text x="44" y="398" font-size="14" fill="#587366">Ilustración didáctica · Supuestos hipotéticos · No es una cotización de mercado</text></g></svg>