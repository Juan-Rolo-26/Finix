<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">El saldo y el poder de compra</title><desc id="desc">Ejemplo didáctico de Finix con supuestos hipotéticos. No es una cotización de mercado.</desc><rect width="480" height="650" rx="18" fill="#f2f7f3"/><g font-family="Arial,Helvetica,sans-serif" font-weight="600"><text x="28" y="35" font-size="12" fill="#087747" letter-spacing="1">FINIX · UN EJEMPLO PARA ENTENDER</text><text x="28" y="82" font-size="25" fill="#153c2b">El saldo y el poder de compra</text><rect x="24" y="165" width="432" height="118" rx="12" fill="#fff" stroke="#d6e5db"/><text x="44" y="199" font-size="17" fill="#587366">Capital inicial</text><text x="44" y="247" font-size="25" fill="#087747">1.000</text><rect x="24" y="300" width="432" height="118" rx="12" fill="#fff" stroke="#d6e5db"/><text x="44" y="334" font-size="17" fill="#587366">Saldo final</text><text x="44" y="382" font-size="25" fill="#087747">1.100</text><rect x="24" y="435" width="432" height="118" rx="12" fill="#fff" stroke="#d6e5db"/><text x="44" y="469" font-size="17" fill="#587366">Inflación</text><text x="44" y="517" font-size="25" fill="#087747">15%</text><text x="28" y="600" font-size="12" fill="#587366">Ilustración didáctica · Supuestos hipotéticos</text><text x="28" y="620" font-size="12" fill="#587366">No representa cotizaciones de mercado</text></g></svg>