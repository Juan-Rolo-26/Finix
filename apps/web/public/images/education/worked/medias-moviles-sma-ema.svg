<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Suavizar implica demorar la reacción</title><desc id="desc">Ejemplo didáctico de Finix con supuestos hipotéticos. Valores de ejemplo: 10 · 12 · 14; SMA de 3: 12; Nuevo dato: 16. No representa cotizaciones actuales.</desc><rect width="960" height="440" rx="18" fill="#f2f7f3"/><rect x="44" y="36" width="6" height="20" rx="3" fill="#087747"/><g font-family="Arial,Helvetica,sans-serif"><text x="62" y="51" font-size="13" fill="#087747" font-weight="700" letter-spacing="1.4">FINIX · EL CONCEPTO EN UN EJEMPLO</text><text x="44" y="105" font-size="30" font-weight="600" fill="#153c2b">Suavizar implica demorar la reacción</text><rect x="44" y="194" width="280" height="154" rx="12" fill="#ffffff" stroke="#d6e5db"/><text x="64" y="228" font-size="15" font-weight="500" fill="#587366">Valores de ejemplo</text><text x="64" y="284" font-size="23" font-weight="700" fill="#087747">10 · 12 · 14</text><rect x="340" y="194" width="280" height="154" rx="12" fill="#ffffff" stroke="#d6e5db"/><text x="360" y="228" font-size="15" font-weight="500" fill="#587366">SMA de 3</text><text x="360" y="284" font-size="23" font-weight="700" fill="#087747">12</text><rect x="636" y="194" width="280" height="154" rx="12" fill="#ffffff" stroke="#d6e5db"/><text x="656" y="228" font-size="15" font-weight="500" fill="#587366">Nuevo dato</text><text x="656" y="284" font-size="23" font-weight="700" fill="#087747">16</text><text x="44" y="398" font-size="14" fill="#587366">Ilustración didáctica · Supuestos hipotéticos · No es una cotización de mercado</text></g></svg>