<!doctype html>
<html lang="es" class="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="/logo-small.webp" />

  <script>
    (function() {
      try {
        var theme = 'light';
        var stored = localStorage.getItem('finix_app_preferences_v4');
        if (stored) {
          var parsed = JSON.parse(stored);
          if (parsed && parsed.state && parsed.state.theme) {
            theme = parsed.state.theme;
          }
        }
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();

    // Early capture of beforeinstallprompt for instant 1-tap PWA install
    window.__finix_deferred_prompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__finix_deferred_prompt = e;
      window.dispatchEvent(new CustomEvent('finix:deferred-prompt-ready'));
    });

    // Auto-recovery for stale chunks or unhandled module errors
    window.addEventListener('error', function(e) {
      var msg = (e && e.message) ? String(e.message) : '';
      var isStale = /failed to fetch dynamically imported module|importing a module script failed|error loading dynamically imported module|chunkloaderror/i.test(msg);
      if (isStale) {
        var key = 'finix:stale-reload';
        var last = Number(sessionStorage.getItem(key) || 0);
        if (!last || Date.now() - last > 15000) {
          sessionStorage.setItem(key, String(Date.now()));
          window.location.reload();
        }
      }
    });

    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason;
      var msg = reason ? (reason.stack || reason.message || String(reason)) : '';
      var isStale = /failed to fetch dynamically imported module|importing a module script failed|error loading dynamically imported module|chunkloaderror/i.test(msg);
      if (isStale) {
        window.location.reload();
      }
    });
  </script>

  <link rel="preload" href="/fonts/inter-latin-2c295d99e26d.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Finix" />
  <link rel="apple-touch-icon" href="/icons/finix-180.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Finix - Finanzas Sociales</title>
</head>

<body class="bg-background text-foreground font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
