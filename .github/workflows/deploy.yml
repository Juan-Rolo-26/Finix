name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar el deploy manualmente desde GitHub si se desea

jobs:
  deploy:
    name: Desplegar en VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y ejecutar deploy.sh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            cd /var/www/finix
            bash deploy.sh
