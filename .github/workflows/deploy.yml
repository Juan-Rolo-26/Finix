name: Deploy to VPS

on:
  # El deploy automático lo ejecuta el pipeline de CI después de pasar sus checks.
  # Se conserva esta vía para despliegues manuales de emergencia.
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar en VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y ejecutar deploy.sh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            FINIX_DIR="${FINIX_DEPLOY_DIR:-}"
            for candidate in "$FINIX_DIR" "$HOME/Finix" "$HOME/finix" "/root/Finix" "/var/www/finix"; do
              [ -n "$candidate" ] || continue
              if [ -f "$candidate/deploy.sh" ]; then
                origin="$(git -C "$candidate" remote get-url origin 2>/dev/null || true)"
                case "$origin" in
                  *github.com:Juan-Rolo-26/Finix.git|*github.com/Juan-Rolo-26/Finix.git)
                    FINIX_DIR="$candidate"
                    break
                    ;;
                esac
              fi
            done
            if [ -z "$FINIX_DIR" ]; then
              echo "No se encontró el repositorio Finix correcto ni su deploy.sh" >&2
              exit 1
            fi
            cd "$FINIX_DIR"
            echo "Deploy desde: $(pwd)"
            echo "Antes del pull: $(git rev-parse --short HEAD)"
            bash deploy.sh
